<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Extract Table Fixture</title>
</head>
<body>
  <h1>Data Tables</h1>

  <!-- Regular Table -->
  <table id="table-team">
    <caption>Team Directory</caption>
    <thead>
      <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Ahmed</td>
        <td>Content</td>
        <td>Completed</td>
      </tr>
      <tr>
        <td>Sara</td>
        <td>Digital Media</td>
        <td>In Progress</td>
      </tr>
      <tr>
        <td>Zayd</td>
        <td>Infrastructure</td>
        <td>Verified</td>
      </tr>
    </tbody>
  </table>

  <!-- Irregular Table with colspans and uneven columns -->
  <table id="table-irregular">
    <caption>Quarterly Financials</caption>
    <tr>
      <th colspan="2">Financial Overview</th>
      <th>Q1</th>
    </tr>
    <tr>
      <td>Gross Revenue</td>
      <td>$500,000</td>
    </tr>
  </table>
</body>
</html>
