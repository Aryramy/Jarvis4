<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Native Validation Form</title>
</head>
<body>
  <h1>Registration Form</h1>
  <form id="validation-form" action="/submit-form-target" method="POST">
    <div>
      <label for="required-name">Username (Required)</label>
      <input type="text" id="required-name" name="username" required>
    </div>
    <div>
      <label for="required-email">Email (Required)</label>
      <input type="email" id="required-email" name="email" required>
    </div>
    <div style="margin-top: 15px;">
      <button type="submit" id="submit-validation-btn">Register</button>
    </div>
  </form>
</body>
</html>
