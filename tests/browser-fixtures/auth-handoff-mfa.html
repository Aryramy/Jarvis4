<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MFA - Verification Required</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #fdfdfd; }
    .card { background: white; padding: 24px; border-radius: 8px; border: 1px solid #d0d7de; max-width: 420px; }
    .btn { background: #2da44e; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .desc { margin: 12px 0; color: #57606a; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="page-heading">Verification Required</h1>
    <div id="mfa-prompt" class="desc">Two-Factor Authentication: Complete verification on your authenticator device</div>
    <div style="margin: 16px 0;">
      <!-- Synthetic action button representing human completing 2FA / push approval in Edge -->
      <button type="button" id="synthetic-human-mfa-btn" class="btn">Approve Second Factor</button>
    </div>
    <div style="font-size: 12px; color: #666;">Do not close this window during verification.</div>
  </div>

  <script>
    document.getElementById('synthetic-human-mfa-btn').addEventListener('click', () => {
      // Human approves second factor -> navigates to authenticated page
      window.location.href = '/auth-handoff-success.html';
    });
  </script>
</body>
</html>
