<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Standard Form Submit</title>
</head>
<body>
  <h1>Contact Us</h1>
  <form id="contact-form" action="/submit-form-target" method="POST">
    <div>
      <label for="user-name">Full Name</label>
      <input type="text" id="user-name" name="name" required value="Alice User">
    </div>
    <div>
      <label for="user-email">Email Address</label>
      <input type="email" id="user-email" name="email" value="alice@example.com">
    </div>
    <div style="margin-top: 15px;">
      <button type="submit" id="submit-btn">Send Message</button>
    </div>
  </form>
</body>
</html>
