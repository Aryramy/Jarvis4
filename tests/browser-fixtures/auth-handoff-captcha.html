<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CAPTCHA - Human Verification Required</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #fafafa; }
    .card { background: white; padding: 24px; border-radius: 8px; border: 1px solid #d0d7de; max-width: 420px; }
    .captcha-box { border: 2px dashed #0969da; padding: 16px; border-radius: 6px; margin: 16px 0; background: #f6f8fa; }
    .btn { background: #0969da; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="page-heading">Human Verification Required</h1>
    <div id="captcha-box" class="captcha-box">
      <div id="captcha-desc" style="font-weight: 600; margin-bottom: 8px;">CAPTCHA Security Check</div>
      <div style="font-size: 13px; color: #57606a; margin-bottom: 12px;">Please verify that you are a human by solving this challenge.</div>
      <!-- Test-only synthetic button representing human solving CAPTCHA challenge in Edge -->
      <button type="button" id="synthetic-human-captcha-btn" class="btn">I am not a robot</button>
    </div>
    <div style="font-size: 12px; color: #666;">Solve the challenge in Edge and click Resume in Control Center.</div>
  </div>

  <script>
    document.getElementById('synthetic-human-captcha-btn').addEventListener('click', () => {
      // Human solves CAPTCHA -> navigates to authenticated page
      window.location.href = '/auth-handoff-success.html';
    });
  </script>
</body>
</html>
