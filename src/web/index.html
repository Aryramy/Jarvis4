<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.75rem;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .button-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button.secondary {
      background: #334155;
    }
    button.secondary:hover {
      background: #475569;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .response-area {
      min-height: 48px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 0.95rem;
      text-align: left;
      word-break: break-word;
      white-space: pre-wrap;
      color: #a5f3fc;
      margin-bottom: 20px;
    }
    .response-area.error {
      color: #f87171;
      border-color: #991b1b;
    }
    .status-indicator {
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px solid #334155;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JARVIS4</h1>
    <form id="text-form" class="input-group">
      <input type="text" id="text-input" placeholder="Enter text for JARVIS..." autocomplete="off" />
      <div class="button-group">
        <button type="submit" id="send-btn" class="secondary">Deterministic Test</button>
        <button type="button" id="ask-ai-btn">Ask AI</button>
        <button type="button" id="ask-ai-stream-btn">Ask AI — Stream</button>
      </div>
    </form>
    <div id="response-area" class="response-area">Ready for input</div>
    <div id="status-indicator" class="status-indicator">Status: Ready</div>
  </div>

  <script>
    const form = document.getElementById('text-form');
    const input = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const askAiBtn = document.getElementById('ask-ai-btn');
    const askAiStreamBtn = document.getElementById('ask-ai-stream-btn');
    const responseArea = document.getElementById('response-area');
    const statusIndicator = document.getElementById('status-indicator');

    function setBusy(busy, statusText) {
      sendBtn.disabled = busy;
      askAiBtn.disabled = busy;
      askAiStreamBtn.disabled = busy;
      if (statusText) {
        statusIndicator.textContent = statusText;
      }
    }

    // Deterministic Brick 1 handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawText = input.value;

      setBusy(true, 'Status: Processing...');

      try {
        const res = await fetch('/api/text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: rawText })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          responseArea.textContent = data.response;
          responseArea.classList.remove('error');
          statusIndicator.textContent = 'Status: Ready';
        } else {
          responseArea.textContent = 'Error: ' + (data.error || 'Failed to process request');
          responseArea.classList.add('error');
          statusIndicator.textContent = 'Status: Error';
        }
      } catch (err) {
        responseArea.textContent = 'Error: ' + err.message;
        responseArea.classList.add('error');
        statusIndicator.textContent = 'Status: Error';
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    // Real AI Brick 4 handler (non-streaming)
    askAiBtn.addEventListener('click', async () => {
      const rawText = input.value;

      setBusy(true, 'Status: Thinking...');

      try {
        const res = await fetch('/api/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: rawText })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          responseArea.textContent = 'AI:\n' + data.response;
          responseArea.classList.remove('error');
          statusIndicator.textContent = 'Status: Ready';
        } else {
          responseArea.textContent = 'Error: ' + (data.error || 'Failed to process AI request');
          responseArea.classList.add('error');
          statusIndicator.textContent = 'Status: Error';
        }
      } catch (err) {
        responseArea.textContent = 'Error: ' + err.message;
        responseArea.classList.add('error');
        statusIndicator.textContent = 'Status: Error';
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    // Real AI Brick 5 handler (streaming)
    askAiStreamBtn.addEventListener('click', async () => {
      const rawText = input.value;

      setBusy(true, 'Status: Thinking...');
      responseArea.textContent = 'AI:\n';
      responseArea.classList.remove('error');

      try {
        const res = await fetch('/api/ai/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: rawText })
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          responseArea.textContent = 'Error: ' + (data.error || 'Failed to start AI stream');
          responseArea.classList.add('error');
          statusIndicator.textContent = 'Status: Error';
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() ?? '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;

            try {
              const msg = JSON.parse(trimmed);
              if (msg.type === 'delta') {
                responseArea.textContent += msg.text;
              } else if (msg.type === 'error') {
                responseArea.textContent = 'Error: ' + msg.message;
                responseArea.classList.add('error');
                statusIndicator.textContent = 'Status: Error';
              } else if (msg.type === 'done') {
                if (!responseArea.classList.contains('error')) {
                  statusIndicator.textContent = 'Status: Ready';
                }
              }
            } catch {
              // Ignore unparseable line
            }
          }
        }
      } catch (err) {
        responseArea.textContent = 'Error: ' + err.message;
        responseArea.classList.add('error');
        statusIndicator.textContent = 'Status: Error';
      } finally {
        setBusy(false);
        if (statusIndicator.textContent === 'Status: Thinking...') {
          statusIndicator.textContent = 'Status: Ready';
        }
        input.focus();
      }
    });
  </script>
</body>
</html>
