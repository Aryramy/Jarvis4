<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.75rem;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button.secondary {
      background: #334155;
    }
    button.secondary:hover {
      background: #475569;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .response-area {
      min-height: 48px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 0.95rem;
      text-align: left;
      word-break: break-word;
      white-space: pre-wrap;
      color: #a5f3fc;
      margin-bottom: 20px;
    }
    .response-area.error {
      color: #f87171;
      border-color: #991b1b;
    }
    .status-indicator {
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px solid #334155;
      padding-top: 12px;
    }
    .mic-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mic-status {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .mic-status.recording {
      color: #f87171;
      font-weight: 600;
    }
    .mic-status.captured {
      color: #38bdf8;
      font-weight: 600;
    }
    .mic-status.error {
      color: #f87171;
    }
    .mic-meta {
      font-size: 0.8rem;
      font-family: monospace;
      color: #cbd5e1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      text-align: left;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JARVIS4</h1>
    <form id="text-form" class="input-group">
      <input type="text" id="text-input" placeholder="Enter text for JARVIS..." autocomplete="off" />
      <div class="button-group">
        <button type="submit" id="send-btn" class="secondary">Deterministic Test</button>
        <button type="button" id="ask-ai-btn">Ask AI</button>
        <button type="button" id="ask-ai-stream-btn">Ask AI — Stream</button>
        <button type="button" id="clear-conv-btn" class="secondary">Clear Conversation</button>
      </div>
    </form>
    <div id="response-area" class="response-area">Ready for input</div>
    <div id="status-indicator" class="status-indicator">Status: Ready</div>

    <!-- Brick 9 Microphone Capture Section, Brick 10 Speech-to-Text, Brick 11 Voice AI, Brick 12 TTS & Brick 13 Voice Turn -->
    <div id="mic-section" class="mic-section">
      <div class="button-group">
        <button type="button" id="start-mic-btn" class="secondary">Start Microphone</button>
        <button type="button" id="stop-mic-btn" class="secondary" disabled>Stop Microphone</button>
        <button type="button" id="run-voice-turn-btn" disabled>Run Voice Turn</button>
        <button type="button" id="transcribe-btn" class="secondary" disabled>Transcribe</button>
        <button type="button" id="ask-jarvis-btn" disabled>Ask JARVIS</button>
        <button type="button" id="speak-response-btn" disabled>Speak Response</button>
      </div>
      <div id="mic-status" class="mic-status">Microphone: Idle</div>
      <div id="mic-meta" class="mic-meta" style="display: none;"></div>
      <audio id="audio-playback" controls style="display: none; width: 100%; margin-top: 4px;"></audio>
      <div id="voice-turn-status" class="mic-status" style="display: none;"></div>
      <div id="stt-status" class="mic-status" style="display: none;"></div>
      <div id="transcript-display" class="response-area" style="display: none; margin-top: 8px;"></div>
      <div id="jarvis-status" class="mic-status" style="display: none;"></div>
      <div id="jarvis-response" class="response-area" style="display: none; margin-top: 8px;"></div>
      <div id="tts-status" class="mic-status" style="display: none;"></div>
      <audio id="tts-playback" controls style="display: none; width: 100%; margin-top: 4px;"></audio>
    </div>
  </div>

  <script type="module">
    import { MicrophoneRecorder } from '/microphone.js';
    import { VoiceTurnRunner, VoiceTurnState } from '/voiceTurn.js';
    const form = document.getElementById('text-form');
    const input = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const askAiBtn = document.getElementById('ask-ai-btn');
    const askAiStreamBtn = document.getElementById('ask-ai-stream-btn');
    const clearConvBtn = document.getElementById('clear-conv-btn');
    const responseArea = document.getElementById('response-area');
    const statusIndicator = document.getElementById('status-indicator');

    const startMicBtn = document.getElementById('start-mic-btn');
    const stopMicBtn = document.getElementById('stop-mic-btn');
    const runVoiceTurnBtn = document.getElementById('run-voice-turn-btn');
    const transcribeBtn = document.getElementById('transcribe-btn');
    const askJarvisBtn = document.getElementById('ask-jarvis-btn');
    const speakResponseBtn = document.getElementById('speak-response-btn');
    const micStatus = document.getElementById('mic-status');
    const micMeta = document.getElementById('mic-meta');
    const audioPlayback = document.getElementById('audio-playback');
    const voiceTurnStatus = document.getElementById('voice-turn-status');
    const sttStatus = document.getElementById('stt-status');
    const transcriptDisplay = document.getElementById('transcript-display');
    const jarvisStatus = document.getElementById('jarvis-status');
    const jarvisResponse = document.getElementById('jarvis-response');
    const ttsStatus = document.getElementById('tts-status');
    const ttsPlayback = document.getElementById('tts-playback');

    const micRecorder = new MicrophoneRecorder();
    const voiceTurnRunner = new VoiceTurnRunner();
    let currentCapturedAudio = null;
    let currentTranscript = null;
    let currentAssistantResponse = null;
    let currentTtsAudioUrl = null;
    let isTtsBusy = false;

    function setBusy(busy, statusText) {
      sendBtn.disabled = busy;
      askAiBtn.disabled = busy;
      askAiStreamBtn.disabled = busy;
      clearConvBtn.disabled = busy;
      if (runVoiceTurnBtn) {
        runVoiceTurnBtn.disabled = busy || voiceTurnRunner.isBusy || !currentCapturedAudio || !currentCapturedAudio.blob;
      }
      if (transcribeBtn) {
        transcribeBtn.disabled = busy || voiceTurnRunner.isBusy || !currentCapturedAudio || !currentCapturedAudio.blob;
      }
      if (askJarvisBtn) {
        askJarvisBtn.disabled = busy || voiceTurnRunner.isBusy || !currentTranscript;
      }
      if (speakResponseBtn) {
        speakResponseBtn.disabled = busy || voiceTurnRunner.isBusy || isTtsBusy || !currentAssistantResponse;
      }
      if (statusText) {
        statusIndicator.textContent = statusText;
      }
    }

    // Deterministic Brick 1 handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawText = input.value;

      setBusy(true, 'Status: Processing...');

      try {
        const res = await fetch('/api/text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: rawText })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          responseArea.textContent = data.response;
          responseArea.classList.remove('error');
          statusIndicator.textContent = 'Status: Ready';
        } else {
          responseArea.textContent = 'Error: ' + (data.error || 'Failed to process request');
          responseArea.classList.add('error');
          statusIndicator.textContent = 'Status: Error';
        }
      } catch (err) {
        responseArea.textContent = 'Error: ' + err.message;
        responseArea.classList.add('error');
        statusIndicator.textContent = 'Status: Error';
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    // Real AI Brick 4 handler (non-streaming)
    askAiBtn.addEventListener('click', async () => {
      const rawText = input.value;

      setBusy(true, 'Status: Thinking...');

      const clientAiStartTime = (typeof performance !== 'undefined' && typeof performance.now === 'function')
        ? performance.now()
        : Date.now();

      try {
        const res = await fetch('/api/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: rawText })
        });

        const data = await res.json();
        const clientAiDurationMs = Math.max(0, Math.round(((typeof performance !== 'undefined' && typeof performance.now === 'function') ? performance.now() : Date.now()) - clientAiStartTime));

        if (res.ok && data.success) {
          responseArea.textContent = 'AI:\n' + data.response;
          responseArea.classList.remove('error');
          statusIndicator.textContent = `Status: Ready | AI: ${clientAiDurationMs} ms`;
          currentAssistantResponse = data.response;
          if (speakResponseBtn) speakResponseBtn.disabled = false;
        } else {
          responseArea.textContent = 'Error: ' + (data.error || 'Failed to process AI request');
          responseArea.classList.add('error');
          statusIndicator.textContent = 'Status: Error';
        }
      } catch (err) {
        responseArea.textContent = 'Error: ' + err.message;
        responseArea.classList.add('error');
        statusIndicator.textContent = 'Status: Error';
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    // Real AI Brick 5 handler (streaming)
    askAiStreamBtn.addEventListener('click', async () => {
      const rawText = input.value;

      setBusy(true, 'Status: Thinking...');
      responseArea.textContent = 'AI:\n';
      responseArea.classList.remove('error');

      try {
        const res = await fetch('/api/ai/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: rawText })
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          responseArea.textContent = 'Error: ' + (data.error || 'Failed to start AI stream');
          responseArea.classList.add('error');
          statusIndicator.textContent = 'Status: Error';
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        let accumulatedStreamText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() ?? '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;

            try {
              const msg = JSON.parse(trimmed);
              if (msg.type === 'delta') {
                responseArea.textContent += msg.text;
                accumulatedStreamText += msg.text;
              } else if (msg.type === 'error') {
                responseArea.textContent = 'Error: ' + msg.message;
                responseArea.classList.add('error');
                statusIndicator.textContent = 'Status: Error';
              } else if (msg.type === 'done') {
                if (!responseArea.classList.contains('error')) {
                  statusIndicator.textContent = 'Status: Ready';
                  if (accumulatedStreamText.trim().length > 0) {
                    currentAssistantResponse = accumulatedStreamText;
                    if (speakResponseBtn) speakResponseBtn.disabled = false;
                  }
                }
              }
            } catch {
              // Ignore unparseable line
            }
          }
        }
      } catch (err) {
        responseArea.textContent = 'Error: ' + err.message;
        responseArea.classList.add('error');
        statusIndicator.textContent = 'Status: Error';
      } finally {
        setBusy(false);
        if (statusIndicator.textContent === 'Status: Thinking...') {
          statusIndicator.textContent = 'Status: Ready';
        }
        input.focus();
      }
    });

    // Clear conversation handler (Brick 6)
    clearConvBtn.addEventListener('click', async () => {
      setBusy(true, 'Status: Clearing conversation...');

      try {
        const res = await fetch('/api/conversation/clear', {
          method: 'POST'
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success) {
          responseArea.textContent = 'Conversation cleared.';
          responseArea.classList.remove('error');
          statusIndicator.textContent = 'Status: Ready';
          currentAssistantResponse = null;
          if (speakResponseBtn) speakResponseBtn.disabled = true;
          if (ttsStatus) ttsStatus.style.display = 'none';
          if (ttsPlayback) {
            ttsPlayback.pause();
            ttsPlayback.style.display = 'none';
          }
          if (currentTtsAudioUrl) {
            URL.revokeObjectURL(currentTtsAudioUrl);
            currentTtsAudioUrl = null;
          }
          if (jarvisStatus) {
            jarvisStatus.style.display = 'none';
          }
          if (jarvisResponse) {
            jarvisResponse.style.display = 'none';
          }
          if (voiceTurnStatus) {
            voiceTurnStatus.style.display = 'none';
          }
        } else {
          responseArea.textContent = 'Error: ' + (data.error || 'Failed to clear conversation');
          responseArea.classList.add('error');
          statusIndicator.textContent = 'Status: Error';
        }
      } catch (err) {
        responseArea.textContent = 'Error: ' + err.message;
        responseArea.classList.add('error');
        statusIndicator.textContent = 'Status: Error';
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    // Microphone capture handlers (Brick 9), STT handlers (Brick 10) & Ask JARVIS (Brick 11)
    startMicBtn.addEventListener('click', async () => {
      micMeta.style.display = 'none';
      audioPlayback.style.display = 'none';
      audioPlayback.src = '';
      sttStatus.style.display = 'none';
      transcriptDisplay.style.display = 'none';
      if (jarvisStatus) jarvisStatus.style.display = 'none';
      if (jarvisResponse) jarvisResponse.style.display = 'none';
      currentCapturedAudio = null;
      currentTranscript = null;
      transcribeBtn.disabled = true;
      if (runVoiceTurnBtn) runVoiceTurnBtn.disabled = true;
      if (askJarvisBtn) askJarvisBtn.disabled = true;
      if (speakResponseBtn) speakResponseBtn.disabled = true;
      if (voiceTurnStatus) voiceTurnStatus.style.display = 'none';

      micStatus.textContent = 'Microphone: Requesting permission...';
      micStatus.className = 'mic-status';
      startMicBtn.disabled = true;

      try {
        await micRecorder.start();
        micStatus.textContent = 'Microphone: Recording';
        micStatus.className = 'mic-status recording';
        stopMicBtn.disabled = false;
      } catch (err) {
        micStatus.textContent = 'Microphone: Error: ' + err.message;
        micStatus.className = 'mic-status error';
        startMicBtn.disabled = false;
        stopMicBtn.disabled = true;
      }
    });

    stopMicBtn.addEventListener('click', async () => {
      stopMicBtn.disabled = true;
      micStatus.textContent = 'Microphone: Stopping...';
      micStatus.className = 'mic-status';

      try {
        const captured = await micRecorder.stop();
        if (captured && captured.size > 0) {
          currentCapturedAudio = captured;
          micStatus.textContent = 'Microphone: Captured';
          micStatus.className = 'mic-status captured';

          const sizeKb = (captured.size / 1024).toFixed(1);
          micMeta.textContent = `Captured: ${captured.durationSec}s | Size: ${sizeKb} KB | Type: ${captured.type}`;
          micMeta.style.display = 'block';

          if (captured.url) {
            audioPlayback.src = captured.url;
            audioPlayback.style.display = 'block';
          }
          transcribeBtn.disabled = false;
          if (runVoiceTurnBtn) runVoiceTurnBtn.disabled = false;
        } else {
          micStatus.textContent = 'Microphone: Error: Captured audio is empty';
          micStatus.className = 'mic-status error';
          transcribeBtn.disabled = true;
          if (runVoiceTurnBtn) runVoiceTurnBtn.disabled = true;
        }
      } catch (err) {
        micStatus.textContent = 'Microphone: Error: ' + err.message;
        micStatus.className = 'mic-status error';
        transcribeBtn.disabled = true;
        if (runVoiceTurnBtn) runVoiceTurnBtn.disabled = true;
      } finally {
        startMicBtn.disabled = false;
        stopMicBtn.disabled = true;
      }
    });

    transcribeBtn.addEventListener('click', async () => {
      if (!currentCapturedAudio || !currentCapturedAudio.blob) {
        return;
      }

      currentTranscript = null;
      if (askJarvisBtn) askJarvisBtn.disabled = true;
      if (jarvisStatus) jarvisStatus.style.display = 'none';
      if (jarvisResponse) jarvisResponse.style.display = 'none';

      transcribeBtn.disabled = true;
      sttStatus.textContent = 'STT: Transcribing...';
      sttStatus.className = 'mic-status';
      sttStatus.style.display = 'block';
      transcriptDisplay.style.display = 'none';

      try {
        const formData = new FormData();
        formData.append('audio', currentCapturedAudio.blob, 'recording.webm');

        const res = await fetch('/api/stt', {
          method: 'POST',
          body: formData
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success) {
          const latencyText = typeof data.durationMs === 'number' ? `STT: ${data.durationMs} ms` : 'STT: Complete';
          sttStatus.textContent = latencyText;
          sttStatus.className = 'mic-status captured';

          transcriptDisplay.textContent = 'Transcript:\n' + data.text;
          transcriptDisplay.classList.remove('error');
          transcriptDisplay.style.display = 'block';

          if (typeof data.text === 'string' && data.text.trim().length > 0) {
            currentTranscript = data.text;
            if (askJarvisBtn) askJarvisBtn.disabled = false;
          } else {
            currentTranscript = null;
            if (askJarvisBtn) askJarvisBtn.disabled = true;
          }
        } else {
          currentTranscript = null;
          if (askJarvisBtn) askJarvisBtn.disabled = true;

          sttStatus.textContent = 'STT: Error';
          sttStatus.className = 'mic-status error';

          transcriptDisplay.textContent = 'Error: ' + (data.error || 'Transcription failed');
          transcriptDisplay.classList.add('error');
          transcriptDisplay.style.display = 'block';
        }
      } catch (err) {
        currentTranscript = null;
        if (askJarvisBtn) askJarvisBtn.disabled = true;

        sttStatus.textContent = 'STT: Error';
        sttStatus.className = 'mic-status error';

        transcriptDisplay.textContent = 'Error: ' + err.message;
        transcriptDisplay.classList.add('error');
        transcriptDisplay.style.display = 'block';
      } finally {
        transcribeBtn.disabled = false;
      }
    });

    // Voice transcript to AI handler (Brick 11)
    askJarvisBtn.addEventListener('click', async () => {
      if (!currentTranscript || typeof currentTranscript !== 'string' || currentTranscript.trim().length === 0) {
        jarvisStatus.textContent = 'JARVIS AI: Error';
        jarvisStatus.className = 'mic-status error';
        jarvisStatus.style.display = 'block';
        jarvisResponse.textContent = 'Error: No valid transcript available to send';
        jarvisResponse.classList.add('error');
        jarvisResponse.style.display = 'block';
        return;
      }

      setBusy(true, 'Status: Thinking...');
      jarvisStatus.textContent = 'JARVIS: Thinking...';
      jarvisStatus.className = 'mic-status';
      jarvisStatus.style.display = 'block';

      const clientAiStartTime = (typeof performance !== 'undefined' && typeof performance.now === 'function')
        ? performance.now()
        : Date.now();

      try {
        const res = await fetch('/api/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: currentTranscript })
        });

        const data = await res.json().catch(() => ({}));
        const clientAiDurationMs = Math.max(0, Math.round(((typeof performance !== 'undefined' && typeof performance.now === 'function') ? performance.now() : Date.now()) - clientAiStartTime));

        if (res.ok && data.success) {
          jarvisStatus.textContent = `AI: ${clientAiDurationMs} ms`;
          jarvisStatus.className = 'mic-status captured';

          jarvisResponse.textContent = 'JARVIS:\n' + data.response;
          jarvisResponse.classList.remove('error');
          jarvisResponse.style.display = 'block';

          responseArea.textContent = 'JARVIS:\n' + data.response;
          responseArea.classList.remove('error');
          statusIndicator.textContent = `Status: Ready | AI: ${clientAiDurationMs} ms`;

          currentAssistantResponse = data.response;
          if (speakResponseBtn) speakResponseBtn.disabled = false;
        } else {
          jarvisStatus.textContent = 'JARVIS AI: Error';
          jarvisStatus.className = 'mic-status error';

          jarvisResponse.textContent = 'Error: ' + (data.error || 'Failed to process AI request');
          jarvisResponse.classList.add('error');
          jarvisResponse.style.display = 'block';

          responseArea.textContent = 'Error: ' + (data.error || 'Failed to process AI request');
          responseArea.classList.add('error');
          statusIndicator.textContent = 'Status: Error';
        }
      } catch (err) {
        jarvisStatus.textContent = 'JARVIS AI: Error';
        jarvisStatus.className = 'mic-status error';

        jarvisResponse.textContent = 'Error: ' + err.message;
        jarvisResponse.classList.add('error');
        jarvisResponse.style.display = 'block';

        responseArea.textContent = 'Error: ' + err.message;
        responseArea.classList.add('error');
        statusIndicator.textContent = 'Status: Error';
      } finally {
        setBusy(false);
        if (currentTranscript && currentTranscript.trim().length > 0) {
          askJarvisBtn.disabled = false;
        }
        if (currentAssistantResponse && currentAssistantResponse.trim().length > 0) {
          speakResponseBtn.disabled = false;
        }
        if (statusIndicator.textContent === 'Status: Thinking...') {
          statusIndicator.textContent = 'Status: Ready';
        }
      }
    });

    // Speak Response handler (Brick 12 explicit TTS action)
    speakResponseBtn.addEventListener('click', async () => {
      if (!currentAssistantResponse || typeof currentAssistantResponse !== 'string' || currentAssistantResponse.trim().length === 0) {
        ttsStatus.textContent = 'TTS: Error: No completed response to speak';
        ttsStatus.className = 'mic-status error';
        ttsStatus.style.display = 'block';
        return;
      }

      if (isTtsBusy) return;
      isTtsBusy = true;
      speakResponseBtn.disabled = true;

      ttsStatus.textContent = 'TTS: Generating...';
      ttsStatus.className = 'mic-status';
      ttsStatus.style.display = 'block';

      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: currentAssistantResponse })
        });

        if (res.ok) {
          const durationHeader = res.headers.get('x-tts-duration-ms');
          const latencyText = durationHeader ? `TTS: ${durationHeader} ms` : 'TTS: Complete';
          ttsStatus.textContent = latencyText;
          ttsStatus.className = 'mic-status captured';

          const blob = await res.blob();
          if (currentTtsAudioUrl) {
            URL.revokeObjectURL(currentTtsAudioUrl);
          }
          currentTtsAudioUrl = URL.createObjectURL(blob);
          ttsPlayback.src = currentTtsAudioUrl;
          ttsPlayback.style.display = 'block';

          ttsStatus.textContent = 'TTS: Playing' + (durationHeader ? ` (${durationHeader} ms)` : '');
          try {
            await ttsPlayback.play();
          } catch {
            // Autoplay permissions or player fallback
          }

          ttsPlayback.onended = () => {
            ttsStatus.textContent = 'TTS: Ready' + (durationHeader ? ` (${durationHeader} ms)` : '');
          };
        } else {
          const errData = await res.json().catch(() => ({}));
          ttsStatus.textContent = 'TTS: Error: ' + (errData.error || 'Failed to synthesize speech');
          ttsStatus.className = 'mic-status error';
        }
      } catch (err) {
        ttsStatus.textContent = 'TTS: Error: ' + err.message;
        ttsStatus.className = 'mic-status error';
      } finally {
        isTtsBusy = false;
        if (currentAssistantResponse && currentAssistantResponse.trim().length > 0) {
          speakResponseBtn.disabled = false;
        }
      }
    });

    // Run Voice Turn handler (Brick 13 explicit sequential voice turn)
    runVoiceTurnBtn.addEventListener('click', async () => {
      // 1. Safety Checks
      if (voiceTurnRunner.isBusy) return;

      if (micRecorder && micRecorder.state === 'recording') {
        voiceTurnStatus.textContent = 'Voice Turn: Error: Microphone is currently recording';
        voiceTurnStatus.className = 'mic-status error';
        voiceTurnStatus.style.display = 'block';
        return;
      }

      if (!currentCapturedAudio || !currentCapturedAudio.blob) {
        voiceTurnStatus.textContent = 'Voice Turn: Error: No recording captured';
        voiceTurnStatus.className = 'mic-status error';
        voiceTurnStatus.style.display = 'block';
        return;
      }

      if (currentCapturedAudio.size === 0 || currentCapturedAudio.blob.size === 0) {
        voiceTurnStatus.textContent = 'Voice Turn: Error: Captured audio is empty (0 bytes)';
        voiceTurnStatus.className = 'mic-status error';
        voiceTurnStatus.style.display = 'block';
        return;
      }

      // 2. Prevent duplicate / concurrent actions during turn
      setBusy(true, 'Status: Running Voice Turn...');
      runVoiceTurnBtn.disabled = true;
      startMicBtn.disabled = true;
      stopMicBtn.disabled = true;
      transcribeBtn.disabled = true;
      if (askJarvisBtn) askJarvisBtn.disabled = true;
      if (speakResponseBtn) speakResponseBtn.disabled = true;

      // 3. Stale data reset for this turn
      currentTranscript = null;
      currentAssistantResponse = null;
      transcriptDisplay.style.display = 'none';
      jarvisResponse.style.display = 'none';
      if (ttsPlayback) {
        ttsPlayback.style.display = 'none';
        ttsPlayback.pause();
      }

      try {
        await voiceTurnRunner.execute({
          audioBlob: currentCapturedAudio.blob,
          audioSize: currentCapturedAudio.size,
          isRecording: micRecorder.state === 'recording',
          onStageChange: (stage, details) => {
            if (stage === VoiceTurnState.STT) {
              voiceTurnStatus.textContent = 'Voice Turn: Transcribing...';
              voiceTurnStatus.className = 'mic-status';
              voiceTurnStatus.style.display = 'block';

              sttStatus.textContent = 'STT: Transcribing...';
              sttStatus.className = 'mic-status';
              sttStatus.style.display = 'block';
            } else if (stage === VoiceTurnState.STT_ERROR) {
              voiceTurnStatus.textContent = 'Voice Turn: STT Error';
              voiceTurnStatus.className = 'mic-status error';

              sttStatus.textContent = 'STT: Error';
              sttStatus.className = 'mic-status error';

              transcriptDisplay.textContent = 'Error: ' + (details.error || 'Transcription failed');
              transcriptDisplay.classList.add('error');
              transcriptDisplay.style.display = 'block';
            } else if (stage === 'STT_SUCCESS') {
              currentTranscript = details.transcript;
              const sttLatencyText = typeof details.durationMs === 'number' ? `STT: ${details.durationMs} ms` : 'STT: Complete';
              sttStatus.textContent = sttLatencyText;
              sttStatus.className = 'mic-status captured';

              transcriptDisplay.textContent = 'Transcript:\n' + details.transcript;
              transcriptDisplay.classList.remove('error');
              transcriptDisplay.style.display = 'block';
            } else if (stage === VoiceTurnState.AI) {
              voiceTurnStatus.textContent = 'Voice Turn: Thinking...';
              voiceTurnStatus.className = 'mic-status';

              jarvisStatus.textContent = 'JARVIS: Thinking...';
              jarvisStatus.className = 'mic-status';
              jarvisStatus.style.display = 'block';
            } else if (stage === VoiceTurnState.AI_ERROR) {
              voiceTurnStatus.textContent = 'Voice Turn: AI Error';
              voiceTurnStatus.className = 'mic-status error';

              jarvisStatus.textContent = 'JARVIS AI: Error';
              jarvisStatus.className = 'mic-status error';

              jarvisResponse.textContent = 'Error: ' + (details.error || 'Failed to process AI request');
              jarvisResponse.classList.add('error');
              jarvisResponse.style.display = 'block';
            } else if (stage === 'AI_SUCCESS') {
              currentAssistantResponse = details.response;
              const aiLatencyText = typeof details.durationMs === 'number' ? `AI: ${details.durationMs} ms` : 'AI: Complete';
              jarvisStatus.textContent = aiLatencyText;
              jarvisStatus.className = 'mic-status captured';

              jarvisResponse.textContent = 'JARVIS:\n' + details.response;
              jarvisResponse.classList.remove('error');
              jarvisResponse.style.display = 'block';

              responseArea.textContent = 'JARVIS:\n' + details.response;
              responseArea.classList.remove('error');
            } else if (stage === VoiceTurnState.TTS) {
              voiceTurnStatus.textContent = 'Voice Turn: Generating speech...';
              voiceTurnStatus.className = 'mic-status';

              ttsStatus.textContent = 'TTS: Generating...';
              ttsStatus.className = 'mic-status';
              ttsStatus.style.display = 'block';
            } else if (stage === VoiceTurnState.TTS_ERROR) {
              voiceTurnStatus.textContent = 'Voice Turn: TTS Error';
              voiceTurnStatus.className = 'mic-status error';

              ttsStatus.textContent = 'TTS: Error: ' + (details.error || 'Failed to synthesize speech');
              ttsStatus.className = 'mic-status error';
            } else if (stage === 'TTS_SUCCESS') {
              const latencyText = typeof details.durationMs === 'number' ? `TTS: ${details.durationMs} ms` : 'TTS: Complete';
              ttsStatus.textContent = latencyText;
              ttsStatus.className = 'mic-status captured';
            } else if (stage === VoiceTurnState.PLAYING) {
              voiceTurnStatus.textContent = `Voice Turn: Playing | Voice Turn Total: ${details.totalDurationMs} ms`;
              voiceTurnStatus.className = 'mic-status captured';
            } else if (stage === VoiceTurnState.PLAYBACK_ERROR) {
              voiceTurnStatus.textContent = 'Voice Turn: Playback Error';
              voiceTurnStatus.className = 'mic-status error';
            }
          },
          playAudioFn: async (blob, metrics) => {
            if (currentTtsAudioUrl) {
              URL.revokeObjectURL(currentTtsAudioUrl);
            }
            currentTtsAudioUrl = URL.createObjectURL(blob);
            ttsPlayback.src = currentTtsAudioUrl;
            ttsPlayback.style.display = 'block';

            const ttsDurationText = metrics.ttsDurationMs ? ` (${metrics.ttsDurationMs} ms)` : '';
            ttsStatus.textContent = 'TTS: Playing' + ttsDurationText;

            try {
              if (typeof ttsPlayback.play === 'function') {
                const p = ttsPlayback.play();
                if (p !== undefined) await p;
              }
            } catch {
              // Controlled fallback if autoplay restricted
            }

            ttsPlayback.onended = () => {
              voiceTurnRunner.state = VoiceTurnState.COMPLETE;
              voiceTurnStatus.textContent = `Voice Turn: Complete | Voice Turn Total: ${metrics.totalDurationMs} ms`;
              ttsStatus.textContent = 'TTS: Ready' + ttsDurationText;
            };
          }
        });
      } finally {
        setBusy(false, 'Status: Ready');
        runVoiceTurnBtn.disabled = !currentCapturedAudio || !currentCapturedAudio.blob;
        transcribeBtn.disabled = !currentCapturedAudio || !currentCapturedAudio.blob;
        if (askJarvisBtn) askJarvisBtn.disabled = !currentTranscript;
        if (speakResponseBtn) speakResponseBtn.disabled = !currentAssistantResponse;
        startMicBtn.disabled = false;
        stopMicBtn.disabled = true;
      }
    });
  </script>
</body>
</html>
